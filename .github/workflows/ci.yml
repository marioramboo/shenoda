name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Lint, Typecheck and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Shared Package Build
        run: npm run build --workspace=@shenoda/shared

      - name: Run Typechecks
        run: npm run typecheck

      - name: Run Unit & Integration Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: github-actions-ci-secret-2026-coptic
          JWT_REFRESH_SECRET: github-actions-ci-secret-2026-coptic
          COOKIE_SECRET: github-actions-ci-cookie-secret

      - name: Build Web & API
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000"
