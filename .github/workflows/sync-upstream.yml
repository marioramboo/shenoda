name: Sync Upstream (marioramboo -> George-STD)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Main Branch with Upstream
    runs-on: ubuntu-latest
    if: github.repository == 'George-STD/shenoda'
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge from Upstream
        run: |
          git remote add upstream https://github.com/marioramboo/shenoda.git
          git fetch upstream main
          
          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/main)
          
          if [ "$LOCAL_HASH" = "$UPSTREAM_HASH" ]; then
            echo "Already up-to-date with upstream/main ($LOCAL_HASH)."
            exit 0
          fi
          
          echo "Syncing changes from upstream ($UPSTREAM_HASH) to local ($LOCAL_HASH)..."
          
          if git merge --ff-only upstream/main; then
            echo "Fast-forward merge successful."
          else
            echo "Fast-forward not possible, doing standard merge..."
            git merge upstream/main --no-edit -m "chore(sync): merge upstream changes from marioramboo/shenoda"
          fi
          
          git push origin main
