version: '3.8'

services:
  # 1. Primary PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: csms_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shenoda_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretProductionPassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations/indexes.sql:/docker-entrypoint-initdb.d/99_indexes.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shenoda_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - csms_internal

  # 2. Redis 7 High-Speed In-Memory Cache (Rate Limiting & Idempotency)
  redis:
    image: redis:7-alpine
    container_name: csms_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-RedisStrongPassword2026!}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisStrongPassword2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - csms_internal

  # 3. Node.js Express API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: csms_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-SecretProductionPassword2026!}@postgres:5432/${DB_NAME:-shenoda_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisStrongPassword2026!}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://shenoda.church}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
    ports:
      - "5000:5000"
    networks:
      - csms_internal

  # 4. Next.js Web Frontend (390px Mobile-First Cairo UI)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: csms_web_prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    networks:
      - csms_internal

  # 5. Automated Encrypted Backup Cron Sidecar (NFR-3.5)
  db_backup:
    image: postgres:16-alpine
    container_name: csms_backup_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - backup_volume:/backups
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_NAME: ${DB_NAME:-shenoda_prod}
      DB_PASSWORD: ${DB_PASSWORD:-SecretProductionPassword2026!}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_BUCKET: ${BACKUP_BUCKET}
    entrypoint: |
      sh -c '
        apk add --no-cache bash openssl aws-cli && \
        chmod +x /usr/local/bin/backup-db.sh && \
        echo "0 2 * * * /usr/local/bin/backup-db.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root && \
        crond -f -l 8
      '
    networks:
      - csms_internal

volumes:
  postgres_data:
  backup_volume:

networks:
  csms_internal:
    driver: bridge
